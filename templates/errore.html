{% extends 'base.html' %}
{% block titolo %}Errore — Stage Match{% endblock %}
{% block contenuto %}
<main class="main" style="display:flex;align-items:center;justify-content:center;min-height:60vh;">
  <div class="profilo-vuoto" style="max-width:440px;width:100%;padding:3rem 2.5rem;">
    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="color:#ef4444;opacity:.7;">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <p class="profilo-vuoto__titolo">{{ titolo or 'Errore' }}</p>
    <p>{{ messaggio or 'Si è verificato un errore imprevisto.' }}</p>
    <a href="{{ url_for('home') }}" class="btn-sondaggio-vuoto" style="text-decoration:none;">← Torna alla home</a>
  </div>
</main>
{% endblock %}
